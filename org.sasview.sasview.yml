  - name: sasview-desktop-resources
    buildsystem: simple
    build-commands:
      - install -Dm644 org.sasview.sasview.desktop ${FLATPAK_DEST}/share/applications/org.sasview.sasview.desktop
      - install -Dm644 org.sasview.sasview.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/org.sasview.sasview.png
      - install -Dm644 org.sasview.sasview.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.sasview.sasview.metainfo.xml
