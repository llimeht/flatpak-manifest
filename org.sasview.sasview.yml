app-id: org.sasview.sasview
# runtime: org.freedesktop.Platform
# runtime-version: "24.08"
# sdk: org.freedesktop.Sdk
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.9'
command: sasview

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=system-bus
  - --device=dri
  - --filesystem=home
  - --share=network
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QT_QPA_PLATFORM=wayland
  # configure clang to build models for sasmodels
  - --env=SAS_COMPILER=unix
  - --env=CC=/app/bin/clang
  - --env=CFLAGS=--sysroot=/app/sysroot
  - --env=LDFLAGS=-fuse-ld=lld

cleanup-commands:
  #- /app/cleanup-BaseApp.sh
  #- mkdir -p ${FLATPAK_DEST}/lib/x86_64-linux-gnu/GL


modules:
  - name: pre-flight
    buildsystem: simple
    build-commands:
      - python --version

  #- include: shared-modules/glu/glu-9.json
  - shared-modules/glu/glu-9.json

  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      # install dependencies offline from bundled wheels
      - python --version
      - python -m pip install --isolated --ignore-installed --no-deps --no-index --find-links=. --prefix=${FLATPAK_DEST} -r requirements.txt
    sources:
      # wheels/ directory generated ahead of time
      - type: dir
        path: wheels
      # pinned requirements file from SasView release 6.1.1
      - type: file
        # url: https://raw.githubusercontent.com/SasView/sasview/release-6.1.1/build_tools/requirements-release-ubuntu-latest.txt
        # sha256:  # fill in after download
        # dest-filename: requirements.txt
        path: requirements.txt

  - name: sasview
    buildsystem: simple
    build-commands:
      - python -m pip install --isolated --ignore-installed --no-deps --no-index --find-links=. --prefix=${FLATPAK_DEST} sasview-*.whl
    sources:
      - type: dir
        path: wheels
      # - type: file
        # path: sasview-6.1.1-py3-none-any.whl

  - name: python-opengl
    buildsystem: simple
    build-commands:
      - cp -r OpenGL ${FLATPAK_DEST}/bin/
    sources:
      - type: archive
        url:  https://files.pythonhosted.org/packages/72/b6/970868d44b619292f1f54501923c69c9bd0ab1d2d44cf02590eac2706f4f/PyOpenGL-3.1.7.tar.gz
        sha256: eef31a3888e6984fd4d8e6c9961b184c9813ca82604d37fe3da80eb000a76c86

  - name: llvm-prebuilt
    buildsystem: simple
    build-commands:
      # llvm tools for: C, C++ and CL compilation
      - mkdir -p ${FLATPAK_DEST}/bin
      - cp -rv -t ${FLATPAK_DEST}/bin/
          bin/{clang,clang-21,clang++,ld.lld,llc,lld,lli,llvm-as,llvm-config,llvm-link,opt}
      # llvm libraries for the above
      - mkdir -p ${FLATPAK_DEST}/lib
      - cp -rv -t ${FLATPAK_DEST}/lib/
          $(bin/llvm-config --libfiles --link-static)
          lib/{libclang*.a,clang}
      # llvm includes for clang and clang++
      - mkdir -p ${FLATPAK_DEST}/lib/clang/21/include/
      - cp -rv -t ${FLATPAK_DEST}/lib/clang/21/
          lib/clang/21/include
      - mkdir -p ${FLATPAK_DEST}/include
      - cp -rv -t ${FLATPAK_DEST}/include/
          include/{clang,c++,llvm,llvm-c,x86_64-unknown-linux-gnu}
      # harvest additional includes necessary for sasmodels
      # this include system headers from libc
      - mkdir -p ${FLATPAK_DEST}/sysroot/usr/lib/
      - cd ${FLATPAK_DEST}/sysroot; ln -s -t . usr/lib; ln -s lib lib64
      - for inc in $(ls -1 2>&- $(bin/clang -O2 -M ${FLATPAK_DEST}/lib/python3*/site-packages/sasmodels/kernel_header.c)); do
          dest=${FLATPAK_DEST}/sysroot/$(dirname $inc);
          mkdir -p $dest;
          cp -v -t $dest $inc;
        done
      # harvest resources from system libc needed by the linker
      - for lib in
          /usr/lib/x86_64-linux-gnu/{crt*.o,libc_nonshared.a,libm.so*,libmvec.so*}
          /usr/lib/gcc/x86_64-unknown-linux-gnu/*/{crt*.o,libgcc*.a}
          /lib/x86_64-linux-gnu/{libc.so*,libgcc*};
          do
          dest=${FLATPAK_DEST}/sysroot/$(dirname $lib);
          mkdir -p $dest;
          cp -v -t $dest $lib;
        done
      - ln -s -t ${FLATPAK_DEST}/sysroot/lib64 /lib64/ld-linux-x86-64.so.2
    sources:
    - type: archive
      url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.4/LLVM-21.1.4-Linux-X64.tar.xz
      sha256: 53c8d9a173c39c952ae367974b0b9c1dcfddeb81341c3d0553748e8407abe9f8

